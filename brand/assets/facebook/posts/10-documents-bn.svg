<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F8F2"/><g transform="translate(80 100) scale(1.015625)"><rect width="64" height="64" rx="16" fill="#164B3F"/><path d="M15 20 45 14 50 44 20 50Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M27 24v15h12" fill="none" stroke="#D9F279" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g fill="#D9F279" stroke="#164B3F" stroke-width="2"><circle cx="15" cy="20" r="5"/><circle cx="45" cy="14" r="5"/><circle cx="50" cy="44" r="5"/><circle cx="20" cy="50" r="5"/></g></g><text x="163" y="149" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="44" fill="#163D33" font-weight="700" >landlord</text><circle cx="371.12" cy="145.26" r="3.74" fill="#164B3F"/><text x="80" y="305" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="32" fill="#164B3F" font-weight="600" >কাগজপত্র থাকুক হাতের কাছে</text><text x="80" y="450" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="72" fill="#163D33" font-weight="600" >দলিল, খতিয়ান,</text><text x="80" y="543.6" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="72" fill="#163D33" font-weight="600" >রসিদ — এক জায়গায়।</text><text x="80" y="690" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="31" fill="#54695B" font-weight="400" >প্রতিটি সম্পত্তির PDF কাগজপত্র</text><text x="80" y="738.05" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="31" fill="#54695B" font-weight="400" >সেই সম্পত্তির সাথেই রাখুন।</text><rect x="80" y="860" width="920" height="270" rx="24" fill="#fff" stroke="#DCE5D7" stroke-width="2"/><path d="M130 915h80v110h-80Z" fill="#EAF1DD" stroke="#A3BC9C" stroke-width="2"/><path d="M148 948h44m-44 20h44m-44 20h28" stroke="#164B3F" stroke-width="3"/><text x="250" y="955" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="31" fill="#163D33" font-weight="600" >দলিল ও মালিকানার কাগজ</text><text x="250" y="1005" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="25" fill="#54695B" font-weight="400" >PDF ফাইল, এক জায়গায়।</text><text x="130" y="1085" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="25" fill="#54695B" font-weight="400" >চাইলে আপলোডের আগে এনক্রিপ্ট করুন।</text><path d="M80 1195H1000" stroke="#DCE5D7"/><text x="80" y="1250" font-family="'DejaVu Sans', 'Noto Sans Bengali', sans-serif" font-size="18" fill="#54695B" font-weight="400" >এনক্রিপশন পাসফ্রেজটি নিরাপদে সংরক্ষণ করুন</text></svg>
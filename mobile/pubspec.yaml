name: landlord_mobile
description: "Landlord for Android and iOS — same Supabase backend as the web app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  cunning_document_scanner: ^3.0.4
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.1.1
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  sqflite: ^2.4.5
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

# Launcher icon from the brand assets (brand/, public/icons/). Regenerate the
# mipmaps after changing these with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/landlord-symbol.png
  adaptive_icon_background: "#164B3F"
  adaptive_icon_foreground: assets/icon/landlord-adaptive.png
  # The maskable source already keeps the glyph inside the safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
